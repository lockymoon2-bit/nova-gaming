name: Update Gaming News

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-news:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install feedparser

      - name: Fetch gaming news
        run: python update_news.py

      - name: Check generated file
        run: |
          test -f news.json
          python -m json.tool news.json > /dev/null

      - name: Save updated news
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add news.json
          if git diff --cached --quiet; then
            echo "No changes to save."
          else
            git commit -m "Update gaming news"
            git push origin HEAD:main
          fi
